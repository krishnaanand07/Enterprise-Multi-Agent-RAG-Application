<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Enterprise RAG Assistant</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon" style="margin: 0 auto;">AI</div>
        <h1>Create Account</h1>
        <p>Get started with your Enterprise RAG Assistant</p>
      </div>

      <div id="alert-box" class="alert-error" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
        </div>

        <button type="submit" id="btn-submit" class="btn-auth">Register Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const alertBox = document.getElementById('alert-box');
      const btnSubmit = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Creating Account...';

        try {
          const fullName = document.getElementById('fullName').value.trim();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          
          await authService.register(email, password, fullName);
          await authService.login(email, password);
          window.location.href = 'index.html';
        } catch (err) {
          alertBox.textContent = err.message || 'Registration failed.';
          alertBox.style.display = 'block';
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Register Account';
        }
      });
    });
  </script>
</body>
</html>
