# ============================================================
# Nginx Configuration — Enterprise RAG Assistant
# ============================================================
# Serves React frontend and proxies API requests to FastAPI
# ============================================================

server {
    listen 80;
    server_name localhost;

    # ── React Frontend (SPA) ──────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Handle client-side routing — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy to FastAPI ──────────────────────────────
    location /api/ {
        # Use Docker DNS to resolve backend dynamically to prevent startup crash
        resolver 127.0.0.11 valid=30s;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for streaming responses)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increase timeouts for LLM responses
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ── File upload size limit ────────────────────────────
    client_max_body_size 50M;

    # ── Security Headers ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Static Asset Caching ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
