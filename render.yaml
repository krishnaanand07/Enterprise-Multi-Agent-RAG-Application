databases:
  - name: rag-postgres
    databaseName: rag_assistant
    user: rag_user
    plan: free

services:
  - type: web
    name: enterprise-rag-backend
    env: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # User needs to set this in the Render dashboard to their Vercel URL
      - key: NVIDIA_API_KEY
        sync: false # User needs to provide this securely in the Render dashboard
      - key: LLM_PROVIDER
        value: nvidia
